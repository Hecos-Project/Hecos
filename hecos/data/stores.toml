# ══════════════════════════════════════════════════════════════════════════════
# Hecos Package Manager — Store Sources
# ══════════════════════════════════════════════════════════════════════════════
# Aggiungi qui tutti i tuoi store. Ogni [[store]] viene interrogato quando
# apri il catalogo nel Packet Manager. Puoi avere infiniti store.
#
# Formati URL supportati:
#   - https://...       URL remoto (index.json deve essere un array di pacchetti)
#   - C:/percorso/...   File locale (utile per sviluppo/testing)
#
# Il campo "enabled" permette di disabilitare temporaneamente uno store
# senza doverlo eliminare.
# ══════════════════════════════════════════════════════════════════════════════

[[store]]
name    = "Hecos Official Store"
url     = "https://hecos-project.github.io/store/index.json"
enabled = true

# ── Esempi aggiuntivi (decommentare per usare) ─────────────────────────────
#
# [[store]]
# name    = "My Local Dev Store"
# url     = "C:/Hecos-Packages/store/index.json"
# enabled = false
#
# [[store]]
# name    = "Community Store"
# url     = "https://example.com/hecos-community-store/index.json"
# enabled = false
# ──────────────────────────────────────────────────────────────────────────
