backend:
  type: ollama
  cloud:
    model: gemini/gemini-2.5-flash
    temperature: 0.7
  kobold:
    url: http://localhost:5001
    model: ''
    max_length: 512
    temperature: 0.7
    top_p: 0.95
    rep_pen: 1.1
  ollama:
    url: http://localhost:11434
    model: nandhank/qwen3.5-abliterated-truthful:9b
    available_models:
      '1': sorc/qwen3.5-claude-4.6-opus:4b
