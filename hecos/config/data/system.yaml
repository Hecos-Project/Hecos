ai:
  active_personality: Urania_9800
  available_personalities:
    '1': Hecos_System_Soul
    '2': Urania_9800
  save_special_instructions: false
  special_instructions: ''
  enable_safety_instructions: true
  safety_instructions: ''
  avatar_size: medium
backend:
  type: cloud
  cloud:
    model: gemini/gemini-3.6-flash
    temperature: 0.7
  kobold:
    url: http://localhost:5001
    model: ''
    max_length: 512
    temperature: 0.8
    top_p: 0.92
    rep_pen: 1.1
  ollama:
    url: http://localhost:11434
    model: ''
    available_models: {}
    num_ctx: 4096
    num_gpu: 25
    num_predict: 250
    temperature: 0.3
    top_p: 0.9
    repeat_penalty: 1.1
    keep_alive: 120m
    probe_timeout_sec: 3
cognition:
  memory_enabled: true
  episodic_memory: true
  clear_on_restart: false
  include_identity_context: true
  include_self_awareness: true
  max_history_messages: 20
  rag:
    enabled: true
    embedder: sentence_transformers
    embedder_model: all-MiniLM-L6-v2
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5
    similarity_threshold: 0.3
    auto_ingest_history: true
    persist_path: memory/vector_store
filters:
  remove_asterisks: both
  remove_round_brackets: voice
  remove_square_brackets: none
  custom_filters: []
  custom_replacements: {}
language: en
llm:
  allow_cloud: true
  debug_llm: true
  providers:
    gemini:
      api_key: ''
      models:
      - gemini-2.0-flash
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-2.5-flash-preview-tts
      - gemini-2.5-pro-preview-tts
