      '9': lukey03/qwen3.5-9b-abliterated:latest
      '10': srchmnmichael/qwen3.5-9B-uncensored:latest
    num_ctx: 4096
    num_gpu: 33
    num_predict: 4096
    temperature: 0.3
    top_p: 0.95
    repeat_penalty: 1.1
    keep_alive: 120m
    probe_timeout_sec: 3
  llama_cpp:
    model: Qwen2.5-Coder-14B-Instruct-abliterated-Q8_0.gguf
    n_gpu_layers: -1
    n_ctx: 32768
    threads: 4
    temperature: 0.7
    top_p: 0.95
    native_tool_calling: true
    text_commands_enabled: true
cognition:
  memory_enabled: true
  episodic_memory: true
  clear_on_restart: false
  include_identity_context: true
  include_self_awareness: true
  max_history_messages: 20
  rag:
    enabled: true
    embedder: sentence_transformers
    embedder_model: all-MiniLM-L6-v2
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5
    similarity_threshold: 0.3
    auto_ingest_history: true
    persist_path: memory/vector_store
