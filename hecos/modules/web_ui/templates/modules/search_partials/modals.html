  <div class="search-modal-backdrop" id="engine-import-modal">

      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="modal-icon"><i class="fas fa-file-import" style="color:var(--accent-cyan);"></i></div>
          <div>

        <textarea id="engine-import-textarea"
          placeholder="Paste here JSON array of engines, YAML, or list of URLs:&#10;&#10;Examples:&#10;- https://search.ononoki.org&#10;- https://searx.tiekoetter.com&#10;- google, bing, duckduckgo, reddit, arxiv&#10;&#10;Or JSON:&#10;[{&quot;name&quot;: &quot;reddit&quot;, &quot;category&quot;: &quot;social media&quot;, &quot;enabled&quot;: true}]"

      </div>
    </div>

  <div class="search-modal-backdrop" id="bookmarks-modal">

      <div class="modal-header">

        <div style="display:flex; align-items:center; gap:10px;">

          <i class="fas fa-star" style="color:#f59e0b; font-size:18px;"></i>

          <h3 style="font-size:16px;">Saved Links &amp; Bookmarks</h3>

        </div>

        <div style="display:flex; align-items:center; gap:8px;">

          <button type="button" class="btn btn-sm btn-secondary"
            style="border-radius:6px; font-size:11px; padding:4px 10px;"
            onclick="window.BookmarksManager.exportBookmarks()" title="Export bookmarks as JSON">

            <i class="fas fa-download"></i> Export

          </button>

          <button class="btn-icon" onclick="window.BookmarksManager.close()"><i class="fas fa-times"></i></button>

        </div>

      <!-- -- Search & Filter Bar -- -->

      <div
        style="display:flex; gap:10px; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--bg1); align-items:center; flex-wrap:wrap;">

          <input type="text" id="bookmarks-search-input" placeholder="Search saved links..."

        </div>

        <div style="display:flex; gap:6px;">

          <button type="button" class="btn btn-sm bookmark-filter-btn active" data-filter="all"

          </button>

          <button type="button" class="btn btn-sm bookmark-filter-btn" data-filter="clear"
            style="border-radius:6px; font-size:11px; padding:4px 10px;"
            onclick="window.BookmarksManager.loadList('clear')">

            <i class="fas fa-globe"></i> ClearWeb

          </button>

          <button type="button" class="btn btn-sm bookmark-filter-btn" data-filter="tor"
            style="border-radius:6px; font-size:11px; padding:4px 10px;"
            onclick="window.BookmarksManager.loadList('tor')">

            <i class="fas fa-user-secret"></i> Onion

          </button>

        </div>

      </div>
