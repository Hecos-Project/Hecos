{#
  control_room_panel.html — Module A
  Included in chat.html between #sidebar and #main.
  Logic lives in control_room_grid.js (grid engine) and control_room.js (panel toggle).
#}
<div id="control-room-panel" aria-label="Control Room" role="complementary">

  <!-- Header ──────────────────────────────────────────── -->
  <div id="room-header">
    <span><i class="fas fa-th-large" style="margin-right:6px;"></i>CONTROL ROOM</span>
    <div id="room-header-actions">
      <!-- Width toggle (1x / 2x) -->
      <button class="room-header-btn" id="room-width-btn" onclick="window.controlRoom.toggleWidth()"
              title="Toggle Size (1x / 2x)" aria-label="Toggle Size">
        <span style="font-weight:700; font-family:var(--font-mono); font-size:10px;">2x</span>
      </button>
      <!-- Edit layout toggle -->
      <button class="room-header-btn" id="room-edit-btn"
              title="{{ t('room_edit_layout') or 'Edit layout' }}" aria-label="{{ t('room_edit_layout') or 'Edit layout' }}">
        <i class="fas fa-pen-to-square"></i>
      </button>
      <!-- Open standalone -->
      <a href="/home" target="_blank" rel="noopener noreferrer"
         class="room-header-btn"
         title="{{ t('room_open_standalone') or 'Open standalone' }}">
        <i class="fas fa-external-link-alt"></i>
      </a>
      <!-- Close -->
      <button class="room-header-btn" onclick="window.controlRoom.toggle()"
              title="{{ t('room_close') or 'Close' }}" aria-label="Close Control Room">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Pages Bar (Home Assistant-style views) ───────────── -->
  <div id="room-pages-bar" class="cr-pages-bar" role="tablist" aria-label="{{ t('room_pages_label') or 'Control Room Pages' }}">
    <button type="button" class="cr-pages-arrow cr-pages-arrow-left" id="cr-pages-scroll-left"
            title="{{ t('room_page_scroll_left') or 'Scroll pages left' }}" aria-label="Scroll pages left">
      <i class="fas fa-chevron-left"></i>
    </button>
    <div class="cr-pages-track" id="cr-pages-track"></div>
    <button type="button" class="cr-pages-arrow cr-pages-arrow-right" id="cr-pages-scroll-right"
            title="{{ t('room_page_scroll_right') or 'Scroll pages right' }}" aria-label="Scroll pages right">
      <i class="fas fa-chevron-right"></i>
    </button>
    <div class="cr-pages-actions">
      <button type="button" class="cr-pages-action-btn cr-pages-add-widget-btn" id="cr-pages-add-widget"
              title="{{ t('room_page_add_widgets') or 'Add / remove widgets on this page' }}" aria-label="Manage page widgets">
        <i class="fas fa-cubes"></i>
        <span class="cr-btn-lbl">+ Widget</span>
      </button>
      <button type="button" class="cr-pages-action-btn cr-pages-add-btn" id="cr-pages-add"
              title="{{ t('room_page_new') or 'New Page' }}" aria-label="New Page">
        <i class="fas fa-plus"></i>
      </button>
    </div>
  </div>

  <!-- Widget Grid ─────────────────────────────────────── -->
  <div id="room-grid" class="grid-stack" gs-column="2" gs-current-row="0" role="main">
    <div class="room-loading">
      <i class="fas fa-spinner fa-spin" style="opacity:0.5;"></i>
      <span style="opacity:0.5;">{{ t('room_loading') or 'Loading widgets…' }}</span>
    </div>
  </div>

  <!-- Footer ──────────────────────────────────────────── -->
  <div id="room-footer">
    <button class="sidebar-btn"
            onclick="window.hecosOpenConfig('#widgets')"
            style="justify-content:center; width:100%; font-size:12px; opacity:0.7;"
            title="{{ t('room_add_widget') or 'Manage widgets in Central Hub' }}">
      <i class="fas fa-plus-circle"></i>
      {{ t('room_add_widget') or 'Add / Manage Widgets' }}
    </button>
  </div>

  <!-- Draggable Resizer -->
  <div id="room-resizer"></div>

</div>

<script>
  // Init the grid engine once the panel is in the DOM
  (function initRoomGrid() {
    function tryInit() {
      const grid = document.getElementById('room-grid');
      const editBtn = document.getElementById('room-edit-btn');
      if (grid && window.controlRoomGrid) {
        // Remove static loading indicator
        const loading = grid.querySelector('.room-loading');
        if (loading) loading.remove();
        controlRoomGrid.init(grid, editBtn);
      } else {
        setTimeout(tryInit, 100);
      }
    }
    tryInit();
  })();
</script>
