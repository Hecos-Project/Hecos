<style>
  /* ── Reboot button: default state ─────────────────────────────────────────── */
  #btn-reboot-system {
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #btn-reboot-system .reboot-btn-icon { display: none; }
  #btn-reboot-system .reboot-btn-label { display: inline; }

  /* ── Reboot button: restart-pending state ────────────────────────────────── */
  @keyframes hcRebootPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); border-color: #facc15; }
    50%       { box-shadow: 0 0 0 6px rgba(250, 204, 21, 0);  border-color: #fde68a; }
  }
  @keyframes hcRebootSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #btn-reboot-system.restart-pending {
    background: transparent !important;
    border: 1.5px solid #facc15 !important;
    color: #facc15 !important;
    animation: hcRebootPulse 1.6s ease-in-out infinite;
    padding: 0 !important;
    width: 34px !important;
    height: 34px !important;
    border-radius: 4px !important;
  }
  #btn-reboot-system.restart-pending .reboot-btn-label { display: none; }
  #btn-reboot-system.restart-pending .reboot-btn-icon  { display: inline-flex; align-items: center; justify-content: center; }
  #btn-reboot-system.restart-pending .reboot-btn-icon svg { animation: hcRebootSpin 2s linear infinite; }
  #btn-reboot-system.restart-pending .reboot-btn-icon .hc-pwr {
    position: absolute;
    font-size: 11px;
    color: #facc15;
  }
</style>

<div class="save-bar">
    <div id="save-msg"></div>
    <button type="button" id="btn-reboot-system" class="btn btn-sm btn-danger" onclick="rebootSystem()" title="{{ t('label_reboot_system') }}">
        <span class="reboot-btn-label">{{ t("label_reboot_system") }}</span>
        <span class="reboot-btn-icon" style="position:relative;width:20px;height:20px;display:none;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-3-6.7" stroke-dasharray="40 14"/>
            </svg>
            <i class="fas fa-power-off hc-pwr"></i>
        </span>
    </button>
    <button type="button" class="btn btn-sm btn-secondary" onclick="window.location.reload()">{{ t("webui_conf_btn_reload") }}</button>
    <button type="button" class="btn btn-sm btn-primary" onclick="saveConfig()">{{ t("webui_conf_btn_save") }}</button>
</div>
