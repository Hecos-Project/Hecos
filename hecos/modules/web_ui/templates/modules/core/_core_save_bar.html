<style>
  /* ── Save Bar Footer ──────────────────────────────────────────────────────── */
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg2);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    z-index: 99;
    box-shadow: var(--shadow-up);
  }

  .save-bar .btn {
    height: 32px !important;
    padding: 5px 14px !important;
    border-radius: 8px !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    line-height: 1.4 !important;
    white-space: nowrap !important;
    box-sizing: border-box !important;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #save-msg {
    font-size: 12px;
    color: var(--muted);
    margin-right: auto;
  }

  /* ── Reboot button: default state ─────────────────────────────────────────── */
  #btn-reboot-system {
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #btn-reboot-system .reboot-btn-icon { display: none; }
  #btn-reboot-system .reboot-btn-label { display: inline-flex; align-items: center; gap: 6px; }

  /* ── Reboot button: restart-pending state ────────────────────────────────── */
  @keyframes hcRebootPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); border-color: #facc15; }
    50%       { box-shadow: 0 0 0 6px rgba(250, 204, 21, 0);  border-color: #fde68a; }
  }
  @keyframes hcRebootSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #btn-reboot-system.restart-pending {
    background: transparent !important;
    border: 1.5px solid #facc15 !important;
    color: #facc15 !important;
    animation: hcRebootPulse 1.6s ease-in-out infinite;
    padding: 0 !important;
    width: 32px !important;
    height: 32px !important;
    border-radius: 8px !important;
  }
  #btn-reboot-system.restart-pending .reboot-btn-label { display: none !important; }
  #btn-reboot-system.restart-pending .reboot-btn-icon  { display: inline-flex !important; align-items: center; justify-content: center; }
  #btn-reboot-system.restart-pending .reboot-btn-icon svg { animation: hcRebootSpin 2s linear infinite; }
  #btn-reboot-system.restart-pending .reboot-btn-icon .hc-pwr {
    position: absolute;
    font-size: 11px;
    color: #facc15;
  }
</style>

<div class="save-bar">
    <div id="save-msg"></div>
    <button type="button" id="btn-reboot-system" class="btn btn-danger" onclick="rebootSystem()" title="{{ t('label_reboot_system') }}">
        <span class="reboot-btn-label"><i class="fas fa-power-off"></i> {{ t("label_reboot_system") }}</span>
        <span class="reboot-btn-icon" style="position:relative;width:20px;height:20px;display:none;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-3-6.7" stroke-dasharray="40 14"/>
            </svg>
            <i class="fas fa-power-off hc-pwr"></i>
        </span>
    </button>
    <button type="button" class="btn btn-secondary" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> {{ t("webui_conf_btn_reload") }}</button>
    <button type="button" class="btn btn-primary" onclick="saveConfig()"><i class="fas fa-save"></i> {{ t("webui_conf_btn_save") }}</button>
</div>
