<!-- Audio History Card -->
<div class="card">
  <div class="card-title"><i class="fas fa-history"></i> TTS Audio History</div>
  <p style="font-size:12px; color:var(--muted); margin-bottom:14px;">
    Hecos saves every vocal response as a WAV file in <code>media/audio/history/</code>, so you can listen to it again from the chat even after a restart.
    Set how many files to keep before the oldest ones are automatically deleted.
  </p>
  <div class="grid-2">
    <div class="field">
      <label>Maximum audio files to keep</label>
      <input type="number" id="v-tts-history-max" min="10" max="1000" step="10" style="width:100%;">
      <p style="font-size:11px; color:var(--muted); margin-top:4px;">Default: 100 — each file lasts about 10-30 seconds.</p>
    </div>
    <div class="field" style="display:flex; flex-direction:column; justify-content:flex-end;">
      <label style="opacity:0;">Actions</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="refreshAudioHistoryCount()">
          <i class="fas fa-sync-alt"></i> Refresh count
        </button>
        <button type="button" class="btn btn-danger btn-sm" onclick="clearAudioHistory()">
          <i class="fas fa-trash-alt"></i> Clear history
        </button>
      </div>
      <span id="v-history-count" style="font-size:11px; color:var(--muted); margin-top:8px;"></span>
    </div>
  </div>
</div>
