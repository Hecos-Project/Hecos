<div class="card">
  <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
    <div><i class="fas fa-globe"></i> GLOBAL DEFAULTS</div>
    <span class="badge-pill badge-neutral">TTS Routing</span>
  </div>
  <div class="field">
    <label>Active TTS Engine</label>
    <select id="v-active-engine" onchange="if(window.switchAudioEngineTab) window.switchAudioEngineTab(this.value); if(window.saveAudioConfig) window.saveAudioConfig();">
      <option value="piper">Piper (Default - Fast)</option>
      <option value="kokoro">Kokoro (Balanced)</option>
      <option value="xtts2">XTTSv2 (High Quality)</option>
      <option value="fish_speech">Fish Speech (Voice Clone / Expressive)</option>
    </select>
  </div>

  <!-- TABS -->
  <div style="display:flex; border-bottom:1px solid var(--border); margin-top:20px; gap:4px;">
    <button id="btn-tab-piper" class="btn btn-secondary active" onclick="window.switchAudioEngineTab('piper')" style="border-bottom-left-radius:0; border-bottom-right-radius:0; padding:8px 16px; border-bottom:none; background:var(--bg3);">
      <i class="fas fa-volume-up"></i> Piper (Fast)
    </button>
    <button id="btn-tab-kokoro" class="btn btn-secondary" onclick="window.switchAudioEngineTab('kokoro')" style="border-bottom-left-radius:0; border-bottom-right-radius:0; padding:8px 16px; border-bottom:none; background:transparent;">
      <i class="fas fa-wave-square"></i> Kokoro (Balanced)
    </button>
    <button id="btn-tab-xtts2" class="btn btn-secondary" onclick="window.switchAudioEngineTab('xtts2')" style="border-bottom-left-radius:0; border-bottom-right-radius:0; padding:8px 16px; border-bottom:none; background:transparent;">
      <i class="fas fa-microchip"></i> XTTSv2 (High Quality)
    </button>
    <button id="btn-tab-fish_speech" class="btn btn-secondary" onclick="window.switchAudioEngineTab('fish_speech')" style="border-bottom-left-radius:0; border-bottom-right-radius:0; padding:8px 16px; border-bottom:none; background:transparent;">
      <i class="fas fa-fish"></i> Fish Speech (Expressive)
    </button>
  </div>
</div>

<script>
  window.switchAudioEngineTab = function(engine, saveEngine = true) {
    const engines = ['piper', 'kokoro', 'xtts2', 'fish_speech'];
    engines.forEach(e => {
      const card = document.getElementById(`card-${e}`);
      if (card) {
        card.style.display = (e === engine) ? 'block' : 'none';
      }
      const btn = document.getElementById(`btn-tab-${e}`);
      if (btn) {
        if (e === engine) {
          btn.style.background = 'var(--bg3)';
          btn.style.color = 'var(--accent)';
          btn.style.borderBottom = '2px solid var(--accent)';
          btn.style.marginBottom = '-1px';
        } else {
          btn.style.background = 'transparent';
          btn.style.color = 'var(--muted)';
          btn.style.borderBottom = 'none';
          btn.style.marginBottom = '0';
        }
      }
    });

    const activeSel = document.getElementById('v-active-engine');
    if (activeSel && activeSel.value !== engine) {
      activeSel.value = engine;
    }

    if (engine === 'fish_speech') {
      if (typeof window.checkFishServerStatus === 'function') window.checkFishServerStatus();
      if (typeof window.loadFishModelList === 'function') window.loadFishModelList();
      if (typeof window.loadFishVoiceCloneList === 'function') window.loadFishVoiceCloneList();
    } else if (engine === 'kokoro') {
      if (typeof window.loadKokoroModelList === 'function') window.loadKokoroModelList();
      if (typeof window.refreshKokoroClonesAll === 'function') window.refreshKokoroClonesAll();
    }

    if (saveEngine && typeof window.saveAudioConfig === 'function') {
      window.saveAudioConfig();
    }
  };

  function switchAudioEngineTab(engine, saveEngine = true) {
    return window.switchAudioEngineTab(engine, saveEngine);
  }

  (function() {
    const initialEngine = document.getElementById('v-active-engine')?.value || 'piper';
    window.switchAudioEngineTab(initialEngine, false);
  })();
</script>
