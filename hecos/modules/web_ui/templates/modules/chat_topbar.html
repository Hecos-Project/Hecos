<div id="topbar">
  <div style="display:flex; align-items:center; gap:15px;">
    <button id="sidebar-toggle-btn" class="desktop-only" onclick="toggleSidebarDesktop()" title="Toggle Sidebar" style="background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; display:flex; align-items:center; transition: color .2s;"><i class="fas fa-bars"></i></button>
    <div id="model-badge" style="display:flex; align-items:center; gap:8px;">
      <div id="tb-status-dot" style="width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green);"></div>
      <span id="tb-model" style="font-size: 13px; font-weight: 500;">{{ t('webui_chat_loading') }}</span>
      <select id="chat-persona-select" class="chat-session-select" onchange="window.saveSessionConfig(); window.updateSessionDropdownTitles();">
          <option value="">&#127381; Persona...</option>
      </select>
      <select id="chat-model-select" class="chat-session-select" onchange="window.saveSessionConfig(); window.updateSessionDropdownTitles();">
          <option value="">&#x1F916; Model...</option>
      </select>
      <select id="chat-tts-engine-select" class="chat-session-select" onchange="window.updateSessionTTSVoices();">
          <option value="">&#x1F50A; TTS Engine...</option>
          <option value="piper">Piper</option>
          <option value="kokoro">Kokoro</option>
          <option value="xtts2">XTTSv2</option>
      </select>
      <select id="chat-tts-voice-select" class="chat-session-select" onchange="window.saveSessionConfig(); window.updateSessionDropdownTitles();">
          <option value="">&#127908; TTS Voice...</option>
      </select>
    </div>
    <script>
      /* ── Chat Session Select Styles ── */
      (function() {
        const style = document.createElement('style');
        style.textContent = `
          .chat-session-select {
            background: #141726;
            color: #e2e8f0;
            border: 1px solid #252b46;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            max-width: 155px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .chat-session-select:hover, .chat-session-select:focus {
            border-color: #6c8cff;
            background: #1c2033;
          }
          .chat-session-select option {
            background: #141726;
            color: #e2e8f0;
          }
        `;
        document.head.appendChild(style);
      })();

      window.sessionConfigOptionsLoaded = false;
      window.chatTtsStatus = null;
      
      async function loadChatConfigOptions() {
          if (window.sessionConfigOptionsLoaded) return;
          try {
              const [optRes, ttsRes] = await Promise.all([
                  fetch('/api/chat/options'),
                  fetch('/api/audio/tts-status')
              ]);
              const data = await optRes.json();
              if (ttsRes.ok) window.chatTtsStatus = await ttsRes.json();
              if (data.ok) {
                  const mSel = document.getElementById('chat-model-select');
                  const pSel = document.getElementById('chat-persona-select');
                  
                  // Keep default options
                  mSel.innerHTML = '<option value="">Default Model</option>';
                  pSel.innerHTML = '<option value="">Default Persona</option>';
                  
                  data.models.forEach(m => {
                      const opt = document.createElement('option');
                      opt.value = m.id;
                      let prefix = m.type === 'cloud' ? '☁️ ' : '🖥️ ';
                      let suffix = '';
                      let sizeTag = '';
                      if (m.parameter_size || m.size_bytes) {
                          sizeTag = ' [';
                          let parts = [];
                          if (m.parameter_size) {
                              let p = m.parameter_size;
                              if (m.quantization_level) p += ' ' + m.quantization_level;
                              parts.push(p);
                          }
                          if (m.size_bytes) {
                              let gb = (m.size_bytes / (1024*1024*1024)).toFixed(1);
                              parts.push(gb + 'GB');
                          }
                          sizeTag += parts.join(' | ') + ']';
                      }
                      let tooltipText = m.name + sizeTag;
                      
                      if (m.capabilities && m.capabilities.length > 0) {
                          const iconMap = { 'tools': '⚙️', 'vision': '👁️', 'thinking': '💭' };
                          const descMap = { 'tools': 'Tools/Function Calling', 'vision': 'Vision/Multimodal', 'thinking': 'Thinking/Reasoning' };
                          
                          const icons = m.capabilities.map(c => iconMap[c]).filter(Boolean).join('');
                          if (icons) suffix = ' ' + icons;
                          
                          const descs = m.capabilities.map(c => descMap[c]).filter(Boolean).join(', ');
                          if (descs) tooltipText += '\nCapabilities: ' + descs;
                      }
                      opt.textContent = prefix + m.name + sizeTag + suffix;
                      opt.title = tooltipText; // Mostrato come tooltip nativo dal browser al mouse over
                      mSel.appendChild(opt);
                  });
                  
                  data.personas.forEach(p => {
                      const opt = document.createElement('option');
                      opt.value = p;
                      opt.textContent = '🎭 ' + p.replace('.yaml', '');
                      pSel.appendChild(opt);
                  });
                  window.sessionConfigOptionsLoaded = true;
              }
          } catch(e) { console.warn("Failed to load chat options", e); }
      }

      window.saveSessionConfig = async function() {
          const sessionId = window.chatHistoryState?.activeSessionId;
          if (!sessionId) return;
          
          const pVal = document.getElementById('chat-persona-select').value;
          const mVal = document.getElementById('chat-model-select').value;
          
          const overrides = {};
          if (pVal) overrides.ai = { active_personality: pVal };
          if (mVal) {
              // Detect cloud by checking if model contains a slash and a known provider prefix.
              // Cloud models from hybrid list are stored as e.g. "openai/gpt-4o", "anthropic/..."
              // Local models are plain names like "llama3", "qwen2.5:7b"
              const knownCloudProviders = ['openai', 'anthropic', 'gemini', 'mistral', 'groq', 'cohere', 'together', 'deepseek', 'xai'];
              const firstSegment = mVal.split('/')[0].toLowerCase();
              const isCloud = mVal.includes('/') && knownCloudProviders.includes(firstSegment);
              if (isCloud) {
                  overrides.backend = { type: 'cloud', cloud: { model: mVal } };
              } else if (mVal.toLowerCase().endsWith('.gguf')) {
                  overrides.backend = { type: 'llama_cpp', llama_cpp: { model: mVal } };
              } else {
                  overrides.backend = { type: 'ollama', ollama: { model: mVal } };
              }
          }
          
          const tEng = document.getElementById('chat-tts-engine-select').value;
          const tVoice = document.getElementById('chat-tts-voice-select').value;
          
          if (tEng || tVoice) {
              if (!overrides.ai) overrides.ai = {};
              if (tEng) overrides.ai.tts_engine = tEng;
              if (tVoice) overrides.ai.tts_voice = tVoice;
          }
          
          try {
              await fetch('/api/chat/session/config', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ session_id: sessionId, config: overrides })
              });
          } catch(e) { console.warn("Failed to save session config", e); }
      };
      
      window.updateSessionDropdownTitles = function() {
          const selects = [
              { el: document.getElementById('chat-model-select'), defaultTitle: 'Default Model' },
              { el: document.getElementById('chat-persona-select'), defaultTitle: 'Default Persona' },
              { el: document.getElementById('chat-tts-engine-select'), defaultTitle: 'Default TTS Engine' },
              { el: document.getElementById('chat-tts-voice-select'), defaultTitle: 'Default TTS Voice' }
          ];
          selects.forEach(obj => {
              const sel = obj.el;
              if (sel && sel.selectedIndex >= 0) {
                  if (sel.value === "") {
                      sel.title = obj.defaultTitle;
                  } else {
                      sel.title = sel.options[sel.selectedIndex].text;
                  }
              }
          });
      };
      
      window.updateSessionTTSVoices = async function(selectedVoice = null) {
          const engine = document.getElementById('chat-tts-engine-select').value;
          const voiceSel = document.getElementById('chat-tts-voice-select');
          if (!voiceSel) return;
          
          voiceSel.innerHTML = '<option value="">\uD83C\uDF99\uFE0F TTS Voice...</option>';
          if (!engine) {
              window.saveSessionConfig();
              return;
          }
          
          try {
              const res = await fetch(`/api/audio/voices?engine=${engine}`);
              if (res.ok) {
                  const voices = await res.json();
                  const voiceList = Array.isArray(voices) ? voices : (voices[engine] || Object.keys(voices));
                  const iter = Array.isArray(voiceList) ? voiceList : Object.keys(voiceList);
                  iter.forEach(v => {
                      const opt = document.createElement('option');
                      opt.value = v;
                      
                      let text = v;
                      if (!Array.isArray(voices)) {
                          if (voices[engine] && typeof voices[engine] === 'object' && !Array.isArray(voices[engine])) {
                              text = voices[engine][v];
                          } else if (voices[v] && typeof voices[v] === 'string') {
                              text = voices[v];
                          }
                      }
                      
                      const ttsStatus = window.chatTtsStatus || {};
                      const engineInstalled = engine === 'piper' ? true : (ttsStatus[engine] !== false);
                      if (!engineInstalled) {
                          text += ' ☁️';
                      }
                      
                      opt.textContent = text;
                      voiceSel.appendChild(opt);
                  });
                  if (selectedVoice) {
                      voiceSel.value = selectedVoice;
                  }
              }
          } catch(e) { console.warn("Failed to load TTS voices", e); }
          window.saveSessionConfig();
      };

      window.resetSessionDropdowns = function() {
          // Called when a new blank chat is created — reset both selects to "Default"
          const mSel = document.getElementById('chat-model-select');
          const pSel = document.getElementById('chat-persona-select');
          const tEngSel = document.getElementById('chat-tts-engine-select');
          const tVoiceSel = document.getElementById('chat-tts-voice-select');
          if (mSel) mSel.value = '';
          if (pSel) pSel.value = '';
          if (tEngSel) tEngSel.value = '';
          if (tVoiceSel) tVoiceSel.innerHTML = '<option value="">\uD83C\uDF99\uFE0F TTS Voice...</option>';
          window.updateSessionDropdownTitles();
      };

      window.loadSessionConfig = async function(sessionId) {
          if (!sessionId) {
              window.resetSessionDropdowns();
              return;
          }
          await loadChatConfigOptions();
          try {
              const res = await fetch('/api/chat/session/config?session_id=' + sessionId);
              const data = await res.json();
              
              const mSel = document.getElementById('chat-model-select');
              const pSel = document.getElementById('chat-persona-select');
              const tEngSel = document.getElementById('chat-tts-engine-select');
              const tVoiceSel = document.getElementById('chat-tts-voice-select');
              
              // Always reset first so new chats show "Default"
              if (mSel) mSel.value = '';
              if (pSel) pSel.value = '';
              if (tEngSel) tEngSel.value = '';
              if (tVoiceSel) tVoiceSel.innerHTML = '<option value="">\uD83C\uDF99\uFE0F TTS Voice...</option>';
              
              if (data.ok && data.config) {
                  if (data.config.ai?.active_personality) {
                      if (pSel) pSel.value = data.config.ai.active_personality;
                  }
                  if (data.config.ai?.tts_engine) {
                      if (tEngSel) {
                          tEngSel.value = data.config.ai.tts_engine;
                          window.updateSessionTTSVoices(data.config.ai?.tts_voice);
                      }
                  }
                  if (data.config.backend) {
                      const bType = data.config.backend.type;
                      const subConf = data.config.backend[bType];
                      if (subConf?.model && mSel) {
                          mSel.value = subConf.model;
                      }
                  }
              }
              window.updateSessionDropdownTitles();
          } catch(e) { console.warn("Failed to load session config", e); }
      };
      
      // Auto-load options once DOM is ready
      document.addEventListener("DOMContentLoaded", () => {
          loadChatConfigOptions().then(() => {
              window.updateSessionDropdownTitles();
          });
      });
    </script>
    <style>@keyframes pulseDot { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); box-shadow: 0 0 12px currentColor; } 100% { opacity: 1; transform: scale(1); } } #tb-status-dot.pulsing { animation: pulseDot 2s infinite; } .mode-chip-autowipe { border-color: rgba(var(--yellow-rgb),0.5) !important; color: var(--yellow) !important; background: rgba(var(--yellow-rgb),0.1) !important; } .mode-chip-incognito { border-color: rgba(var(--accent2-rgb),0.5) !important; color: var(--accent2) !important; background: rgba(var(--accent2-rgb),0.1) !important; }</style>
  </div>
  <div class="topbar-chips">
    <div id="topbar-mode-chip" style="display:none;"></div>
    <div class="topbar-chip" id="chip-mic"><i class="fas fa-microphone"></i> MIC: —</div>
    <div class="topbar-chip" id="chip-tts"><i class="fas fa-volume-up"></i> TTS: —</div>
    <div class="topbar-chip" id="chip-ptt"><i class="fas fa-keyboard"></i> PTT: —</div>
    <button id="topbar-stop-voice-btn" class="topbar-chip on" style="display:none; cursor:pointer; background:rgba(var(--red-rgb),0.2); border-color:var(--red); color:var(--red);" onclick="stopVoice()"><i class="fas fa-stop" style="margin-right:6px;"></i> Stop Voice</button>
    <a id="topbar-hub-link" href="/hecos/config/ui" target="_blank" class="topbar-link"><i class="fas fa-cog"></i> <span>Hub</span></a>
    {% if is_hpm_installed('drive') %}
    <a id="topbar-drive-link" href="/drive" target="_blank" class="topbar-link"><i class="fas fa-hdd"></i> <span>Drive</span></a>
    {% endif %}
    {% if is_hpm_installed('flows') %}
    <a id="topbar-flows-link" href="/flows" target="_blank" class="topbar-link"><i class="fas fa-project-diagram"></i> <span>Flows</span></a>
    {% endif %}
  </div>
</div>
