<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hecos TV Remote — Live Streams</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/netsearch_static/css/stream_hunter/stream_hunter.css?v=1.3.4">
  <link rel="stylesheet" href="/netsearch_static/css/stream_hunter/stream_remote.css?v=1.3.4">
</head>
<body class="sh-popout-body">
  <div class="sh-popout-container">
    {% include 'search_partials/stream_remote_widget.html' %}

    <div class="sh-popout-lineup-panel">
      <div class="sh-popout-lineup-header">
        <span><i class="fas fa-list-ol"></i> Lineup Channels</span>
        <span class="sh-pill sh-pill-meta" id="sh-popout-qcount">0 CH</span>
      </div>
      <div class="sh-popout-lineup-list" id="sh-popout-lineup-list">
        <div class="sh-popout-empty">Open Live Streams in Net Search or ask Hecos AI to scan channels.</div>
      </div>
    </div>
  </div>

  <script>
    window.SH_REMOTE_INITIAL_STATE = {{ initial_state | tojson }};
    window.SH_REMOTE_POPOUT_MODE = true;
  </script>
  <script src="/netsearch_static/js/search/stream_hunter/stream_remote.js?v=1.3.4"></script>
</body>
</html>
