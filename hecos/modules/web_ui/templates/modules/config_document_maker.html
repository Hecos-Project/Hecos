<!-- Document Maker Config Panel -->
<div id="tab-docs" class="panel">

  <!-- Header Card -->
  <div class="card" style="margin-bottom:14px; padding:12px 16px; background:linear-gradient(135deg, rgba(var(--accent-rgb),0.08), var(--bg2));">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, #e74c3c, #c0392b); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i class="fas fa-file-pdf" style="color:#fff; font-size:15px;"></i>
      </div>
      <div>
        <div style="font-weight:700; color:var(--text); font-size:0.95em;">Document Maker</div>
        <div style="font-size:0.72em; color:var(--muted);">PDF generation via Playwright</div>
      </div>
    </div>
  </div>

  <!-- Output Settings Card -->
  <div class="card">
    <div class="card-title"><i class="fas fa-folder-open"></i> Output Settings</div>

    <div class="field">
      <label for="docs-pdf-save-path">Default Save Path
        <small style="color:var(--muted); font-weight:400;">(relative to Hecos root)</small>
      </label>
      <input
        type="text"
        id="docs-pdf-save-path"
        class="config-input"
        value="media/documents"
        placeholder="media/documents"
        oninput="docsDebounceSave()"
      >
      <p style="color:var(--muted); font-size:11px; margin-top:5px;">
        PDF files generated by the agent will be stored in this folder.
        Example: <code style="background:var(--bg3); padding:1px 5px; border-radius:4px;">media/documents</code>
      </p>
    </div>

    <!-- Autosave status indicator -->
    <div id="docs-save-status" style="display:none; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-top:8px;">
      <i class="fas fa-check-circle" style="color:#27ae60;"></i>
      <span>Settings saved</span>
    </div>
  </div>

</div>
