<div class="tpl-field">
  <label>Body</label>
  <div class="tpl-textarea-wrap">
    <textarea id="tpl-edit-body"
              class="tpl-body-textarea"
              placeholder="Template body… Hello {{ nome }}, your order is ready."

  </div>
</div>
