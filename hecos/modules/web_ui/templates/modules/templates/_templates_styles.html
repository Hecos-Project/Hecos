<style>
/* ── Templates Manager — Scoped Styles ────────────────────────────────── */
.tpl-root { height: 100%; }

.tpl-layout {

  height: 100%;

}
.tpl-layout.hide-sidebar .tpl-sidebar { display: none; }

/* Sidebar */
.tpl-sidebar {

  flex-direction: column;

}

}
.tpl-icon-btn:hover { border-color: var(--accent); color: var(--accent); }

}

.tpl-channel-item {

.tpl-channel-item.active {

.tpl-channel-item i { width: 14px; text-align: center; opacity: 0.7; }

.tpl-new-btn:hover { background: rgba(var(--accent-rgb),0.15); color: var(--accent); }

/* Main area */
.tpl-main { flex: 1; overflow-y: auto; padding: 20px 24px; }
.tpl-empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 300px; gap: 12px;

}
.tpl-section { margin-bottom: 18px; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
.tpl-section-title { font-size: 0.8rem; font-weight: 600; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.tpl-section-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }

  transition: border-color .2s, background .2s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.tpl-import-drop:hover, .tpl-import-drop.drag-over {

.tpl-import-drop i { font-size: 1.4rem; color: var(--accent); opacity: 0.6; }

}
.tpl-name-input:focus { border-bottom-color: var(--accent); }
.tpl-channel-select {

.tpl-optional { color: var(--muted); font-size: 0.75rem; margin-left: 4px; }

.tpl-btn {

  background: rgba(255,255,255,0.05); color: var(--text);

}
.tpl-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.2); }

.tpl-btn-danger { border-color: rgba(220,50,50,0.4); color: #f87171; }
.tpl-btn-danger:hover { background: rgba(220,50,50,0.1); }
.tpl-sidebar-toggle { border: none; background: transparent; color: var(--muted); padding: 4px 8px; }

.tpl-tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 16px; }
.tpl-tab {

  padding: 7px 14px; font-size: 0.8rem; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  display: flex; align-items: center; gap: 6px;
  transition: color .15s, border-color .15s;
}
.tpl-tab:hover { color: var(--text); }
.tpl-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tpl-tab-pane { display: none; }
.tpl-tab-pane.active { display: block; }

/* Textarea editor */
.tpl-textarea-wrap { position: relative; }
.tpl-body-textarea {
  width: 100%; min-height: 220px;
  background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 5px; color: var(--text);
  padding: 12px; font-size: 0.85rem; font-family: 'Courier New', monospace;
  resize: vertical; outline: none; line-height: 1.55;
  transition: border-color .2s;
}
.tpl-body-textarea:focus { border-color: var(--accent); }
.tpl-char-count { font-size: 0.72rem; color: var(--muted); text-align: right; margin-top: 3px; }

/* Variables tab */
.tpl-vars-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.tpl-vars-header p { font-size: 0.8rem; color: var(--muted); margin: 0; }
.tpl-vars-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tpl-var-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(var(--accent-rgb),0.1); border: 1px solid rgba(var(--accent-rgb),0.25);

  font-size: 0.76rem; cursor: pointer; transition: background .15s;
}
.tpl-var-chip:hover { background: rgba(var(--accent-rgb),0.2); }
.tpl-vars-hint { font-size: 0.75rem; color: var(--muted); opacity: 0.6; }

.tpl-messenger-info {

  border: 1px solid rgba(255,255,255,0.07);
}
.tpl-messenger-info i { font-size: 1rem; }
.tpl-messenger-info code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; }

/* Preview */
.tpl-preview-controls { margin-bottom: 14px; }
.tpl-preview-controls label { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; display: block; }
.tpl-preview-controls textarea {

}
.tpl-preview-result { background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.07); border-radius: 5px; padding: 14px; }
.tpl-preview-subject-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.83rem; }
.tpl-preview-subject-val { color: var(--text); }
.tpl-preview-iframe { width: 100%; min-height: 300px; border: none; border-radius: 4px; background: white; }
.tpl-preview-text { font-family: monospace; font-size: 0.82rem; color: var(--text); white-space: pre-wrap; word-break: break-word; margin: 0; }

.tpl-history-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
.tpl-history-list { display: flex; flex-direction: column; gap: 6px; }
.tpl-history-item {

}
.tpl-history-empty { color: var(--muted); opacity: 0.5; font-size: 0.8rem; padding: 8px 0; }

/* GrapeJS wrapper */
.tpl-grapes-wrapper { border: 1px solid rgba(255,255,255,0.09); border-radius: 5px; overflow: hidden; }
.tpl-grapes-loading { padding: 30px; text-align: center; color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tpl-grapes-layout { display: flex; flex-direction: column; height: 500px; }
.tpl-grapes-main { display: flex; flex: 1; overflow: hidden; }
.tpl-grapes-canvas { flex: 1; overflow: hidden; }
.tpl-grapes-right { width: 220px; border-left: 1px solid rgba(255,255,255,0.07); overflow-y: auto; }
.tpl-grapes-panel { padding: 4px; }
.tpl-grapes-blocks-top { overflow-x: auto; white-space: nowrap; padding: 4px 8px; }
.tpl-grapes-layout.hide-right-panel .tpl-grapes-right { display: none; }
