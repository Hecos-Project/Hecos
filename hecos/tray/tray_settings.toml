# Hecos Tray — Settings
# ─────────────────────────────────────────────────────────────
# This file is read on every tray startup.
# You can edit it with any text editor while the tray is closed.
# Boolean values: true / false   |   Strings must be in "quotes"
# ─────────────────────────────────────────────────────────────


# Launch the Hecos core service automatically when the tray starts
start_hecos_on_launch = false

# Open the web browser to the Hecos UI when the service comes online
autoopen_webui = false

# Open the built-in AI browser (Playwright) on service startup
autoopen_ai_browser = false

# Launch Chrome in CDP/AI-ready mode on tray startup
auto_launch_chrome_for_ai = false

# URL to open when the browser or WebUI auto-launch
browser_startup_url = "http://localhost:7070"

# true = AI browser runs hidden in the background
browser_headless = false

# Show the Advanced / Debug submenu in the tray icon menu
show_technical_menu = true

# Run Hecos under the Supervisor watchdog (auto-restart on crash)
use_daemon = true

# Enable full ANSI colour output in the live-log tab
full_color_logs = false
