# Hecos — Community Update Sources List
# ─────────────────────────────────────────────────────────────────────────────
# This file can be imported from the Dashboard → Updates → Import source list.
#
# FORMAT (per ogni sorgente):
#   [[sources]]
#   name = "Nome Leggibile"      <-- nome che apparirà nella dashboard
#   url  = "https://..."         <-- GitHub API o endpoint JSON personalizzato
#   type = "github_release"      <-- oppure "custom_json"
#
# GitHub API format:
#   https://api.github.com/repos/<owner>/<repo>/releases/latest
#
# Custom JSON format — il server deve restituire:
#   { "version": "1.2.3", "assets": [{"name": "file.exe", "url": "https://..."}] }
# ─────────────────────────────────────────────────────────────────────────────

