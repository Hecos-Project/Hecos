[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecos-core"
version = "0.55.2"
description = "Helping Companion System"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "tomli-w>=1.0,<2.0",
    "litellm>=1.50,<2.0",
    "tenacity>=8.0,<10.0",
    "babel>=2.14,<3.0",
    "holidays>=0.50,<2.0",
    "requests>=2.31,<3.0",
    "psutil>=5.9,<8.0",
    "flask>=3.0,<4.0",
    "flask-login>=0.6,<1.0",
    "flask-compress>=1.14,<2.0",
    "cryptography>=42.0,<55.0",
    "SpeechRecognition>=3.10,<4.0",
    "PyAudio>=0.2.13,<1.0",
    "fastembed>=0.4,<1.0",
    "lancedb>=0.33.0,<1.0",
    "sentence-transformers>=3.0,<7.0",
    "sounddevice>=0.4,<1.0",
    "pygame>=2.5,<3.0",
    "GPUtil>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "soundfile>=0.12,<1.0",
    "kokoro>=0.9,<1.0",
    "misaki[en]>=0.9,<1.0",
    "pynput>=1.7,<2.0",
    "playwright>=1.40.0,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "pypdf>=4.0,<7.0",
    "python-docx>=1.1,<2.0",
    "rich>=13.0.0,<16.0",
    "uv>=0.5.0,<1.0",
    "ruff>=0.14.0,<1.0",
    "tree-sitter-language-pack>=1.0.0,<2.0",
    "grep-ast>=0.8.0,<1.0",
    "pytest>=8.0.0,<10.0",
    "diff-match-patch>=20241021",
    "pathspec>=0.12.0,<2.0",
]

[project.optional-dependencies]
# Install with: pip install ".[service]"
service = [
    "pywin32>=306; sys_platform=='win32'",
    "pystray>=0.19,<1.0",
    "pillow>=10.0,<14.0",
    "customtkinter>=5.2,<7.0",
    "qrcode>=7.4,<9.0",
]

# Install with: pip install ".[llama_cpp]"
# Required if you want to use the llama-cpp-python Python module server
# instead of the native llama-server binary (e.g., Ollama's llama-server.exe)
# Note: llama-cpp-python requires C++ Build Tools on Windows to compile from source.
# Use the prebuilt wheel: pip install llama-cpp-python==0.2.70 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
llama_cpp = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0,<1.0",
    "diskcache>=5.6.1,<6.0",
    "sse-starlette>=1.6.1,<3.0",
    "starlette-context>=0.3.6,<0.4",
]

# Install with: pip install ".[fish_speech]"
# On-demand local and cloud engine for Fish Speech TTS
fish_speech = [
    "ormsgpack>=1.12.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "soundfile>=0.12.1,<1.0",
    "fish-audio-sdk>=1.3.0,<2.0",
    "kui>=1.6.0,<2.0",
    "uvicorn>=0.30.0,<1.0",
    "loguru>=0.6.0,<1.0",
    "pyrootutils>=1.0.4,<2.0",
    "hydra-core>=1.3.2,<2.0",
    "natsort>=8.4.0,<9.0",
    "einx>=0.2.2,<1.0",
    "pydub>=0.25.1,<1.0",
    "resampy>=0.4.3,<1.0",
    "silero-vad>=5.1,<7.0",
    "opencc-python-reimplemented>=0.1.7,<1.0",
    "descript-audio-codec>=1.0.0,<2.0",
    "huggingface_hub>=0.23.0,<2.0",
]


[tool.setuptools.packages.find]
where = ["."]
