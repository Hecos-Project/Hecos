[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build-meta"

[project]
name = "hecos-core"
version = "0.27.2"
description = "Helping Companion System"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "tomli-w",
    "litellm",
    "tenacity",
    "babel",
    "holidays",
    "requests",
    "psutil",
    "flask",
    "flask-login",
    "flask-compress",
    "cryptography",
    "SpeechRecognition",
    "PyAudio",
    "fastembed",
    "lancedb>=0.33.0",
    "sentence-transformers",
    "sounddevice",
    "pygame",
    "GPUtil",
    "numpy",
    "soundfile",
    "pynput",
    "playwright>=1.40.0",
    "beautifulsoup4",
]

[project.optional-dependencies]
# Install with: pip install ".[service]"
service = [
    "pywin32; sys_platform=='win32'",
    "pystray",
    "pillow",
    "customtkinter",
    "qrcode",
]

# Install with: pip install ".[llama_cpp]"
# Required if you want to use the llama-cpp-python Python module server
# instead of the native llama-server binary (e.g., Ollama's llama-server.exe)
# Note: llama-cpp-python requires C++ Build Tools on Windows to compile from source.
# Use the prebuilt wheel: pip install llama-cpp-python==0.2.70 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
llama_cpp = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "diskcache>=5.6.1",
    "sse-starlette>=1.6.1",
    "starlette-context>=0.3.6,<0.4",
]


[tool.setuptools.packages.find]
where = ["."]